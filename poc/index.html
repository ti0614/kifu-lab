<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yaneuraou.wasm PoC</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; }
  label { display: inline-block; margin: 4px 12px 4px 0; }
  input[type=text] { width: min(100%, 720px); }
  pre { background: #f4f4f4; padding: 8px; overflow-x: auto; font-size: 12px; }
</style>
<h1>yaneuraou.wasm PoC（つようら王11）</h1>
<p>crossOriginIsolated: <b id="coi"></b> / hardwareConcurrency: <b id="hc"></b></p>
<div>
  <label>評価関数 <select id="variant"><option>mini</option><option>micro</option></select></label>
  <label>Threads <input id="threads" type="number" value="1" min="1" max="32"></label>
  <label>movetime(ms) <input id="movetime" type="number" value="3000" min="100" step="100"></label>
</div>
<div><label>position <input id="position" type="text" value="position startpos"></label></div>
<button id="load">読み込み</button>
<button id="go" disabled>go</button>
<pre id="log"></pre>
<script>
// ../build/wasm-<variant>/ のエンジンと ../eval/<variant>/ の評価関数を読み込む。
// ?auto=1 を付けると読み込み → go まで自動で実行する（tools/browser_test.js 用）。
const $ = (id) => document.getElementById(id);
const log = (s) => { $("log").textContent += s + "\n"; };
const params = new URLSearchParams(location.search);
for (const k of ["variant", "threads", "movetime"]) if (params.has(k)) $(k).value = params.get(k);
$("coi").textContent = String(self.crossOriginIsolated);
$("hc").textContent = String(navigator.hardwareConcurrency);
window.lines = [];
let engine = null;

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function load() {
  const v = $("variant").value;
  $("load").disabled = true;
  const t0 = performance.now();
  await loadScript(`../build/wasm-${v}/yaneuraou.js`);
  const yo = await YaneuraOu({ locateFile: (f) => `../build/wasm-${v}/${f}` });
  // wasm_pre.js が print を差し替えるので、出力は addMessageListener で受け取る。
  yo.addMessageListener((s) => {
    for (const l of s.split("\n")) if (l && !l.startsWith("option") && !l.startsWith("id ")) { lines.push(l); log(l); }
  });
  log(`# module init ${Math.round(performance.now() - t0)}ms`);
  yo.FS.mkdir("/eval");
  for (const f of ["nn.bin", "progress.bin"]) {
    const res = await fetch(`../eval/${v}/${f}`);
    if (!res.ok) throw new Error(`eval/${v}/${f}: ${res.status}`);
    yo.FS.writeFile(`/eval/${f}`, new Uint8Array(await res.arrayBuffer()));
  }
  log(`# eval files loaded ${Math.round(performance.now() - t0)}ms`);
  // wasm_pre.js のコマンドキューは使わず、usi_command を直接呼ぶ。
  engine = (c) => yo.ccall("usi_command", "number", ["string"], [c]);
  for (const c of ["usi", "setoption name EvalDir value /eval", "setoption name FV_SCALE value 24",
    `setoption name Threads value ${$("threads").value}`, "setoption name USI_Hash value 256",
    "setoption name BookFile value no_book", "isready"]) engine(c);
  $("go").disabled = false;
}

function go() {
  engine("usinewgame");
  engine($("position").value);
  engine(`go movetime ${$("movetime").value}`);
}

$("load").onclick = () => load().catch((e) => log("ERROR " + e));
$("go").onclick = go;
if (params.get("auto") === "1") load().then(go).catch((e) => log("ERROR " + e));
</script>
</html>
